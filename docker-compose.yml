version: '3.8'

services:
  couchdb:
    image: couchdb:3.3
    container_name: club_videos_db
    restart: unless-stopped
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: admin_password
    ports:
      - '5984:5984'
    volumes:
      - couchdb_data:/opt/couchdb/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:5984/_up']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  couchdb_data:
    driver: local
