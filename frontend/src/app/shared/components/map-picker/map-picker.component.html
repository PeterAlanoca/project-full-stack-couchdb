<div class="map-picker-wrapper">
  <div #mapContainer class="map-container"></div>

  <div class="map-address-bar">
    <span class="address-icon">📍</span>
    <span class="address-text">{{ displayAddress() }}</span>
  </div>

  <div class="map-hint">
    <span>🖱️ Haz clic en el mapa o arrastra el marcador para ajustar la ubicación</span>
  </div>
</div>
